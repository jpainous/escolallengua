<p style="transform: scaleX(-1);">Hola món</p>
<p style="transform: scaleY(-1);">Hola món</p>
<p style="transform: rotate(180deg);">Hola món</p>
<p style="writing-mode: vertical-rl;">Hola món</p>
<script>
  const paraula = "Hola";
  const invertida = paraula.split("").reverse().join("");
  document.write(invertida); // "aloH"
</script>
